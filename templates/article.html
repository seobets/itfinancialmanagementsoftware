<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{title}} | ITFM Software Guide</title>

  <meta name="description" content="{{description}}">

  <link
    rel="canonical"
    href="https://itfinancialmanagementsoftware.com/blog/{{slug}}/"
  >

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <header class="site-header">
    <div class="container">

      <a class="logo" href="/">
        ITFM Software Guide
      </a>

      <nav>
        <a href="/">Home</a>
        <a href="/#methodologies">Methodologies</a>
        <a href="/#buyers-guide">Buyer's Guide</a>
        <a href="/blog/">Blog</a>
      </nav>

    </div>
  </header>


  <main>

    <article class="blog-article">

      <div class="container narrow">

        <div class="article-meta">
          <span>{{category}}</span>
          <span>{{date}}</span>
        </div>

        {{content}}

      </div>

    </article>

  </main>


  <footer class="site-footer">

    <div class="container">

      <strong>ITFM Software Guide</strong>

      <p>
        Independent guidance for CIOs, CFOs and IT finance teams
        evaluating IT Financial Management methodologies and software.
      </p>

    </div>

  </footer>

</body>
</html>
